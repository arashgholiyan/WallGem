<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#06070a;border-radius:16px;font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Filter Glows -->
    <filter id="likeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="passGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
    <filter id="dockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="500" cy="180" r="280" fill="url(#bgGlow)"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="1000" height="60" fill="#0d101a" opacity="0.9"/>
  <line x1="0" y1="60" x2="1000" y2="60" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Logo -->
  <rect x="28" y="14" width="32" height="32" rx="8" fill="url(#accentBtn)"/>
  <text x="44" y="36" font-size="18" text-anchor="middle" fill="#ffffff">💎</text>
  <text x="72" y="36" font-size="18" font-weight="bold" fill="#f8fafc" letter-spacing="-0.5">Wall Gem</text>
  <rect x="175" y="19" width="60" height="20" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
  <text x="205" y="33" font-size="10" font-weight="bold" fill="#818cf8" text-anchor="middle">4K UHD</text>

  <!-- Progress Bar (3/5) -->
  <g transform="translate(730, 16)">
    <rect width="180" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- Progress fill -->
    <rect x="12" y="11" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="12" y="11" width="36" height="6" rx="3" fill="#10b981"/>
    <text x="120" y="19" font-size="12" font-weight="bold" fill="#10b981">3 / 5 Liked</text>
    <circle cx="160" cy="14" r="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="160" y="18" font-size="10" text-anchor="middle" fill="#94a3b8">📁</text>
  </g>

  <!-- Category Selector Chips -->
  <g transform="translate(40, 78)">
    <!-- Active Chip 'All' -->
    <rect x="0" y="0" width="64" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="32" y="20" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle">All</text>

    <!-- Chip 'Landscape' -->
    <rect x="74" y="0" width="94" height="30" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="121" y="20" font-size="12" fill="#94a3b8" text-anchor="middle">Landscape</text>

    <!-- Chip 'Cyberpunk' -->
    <rect x="178" y="0" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="226" y="20" font-size="12" fill="#94a3b8" text-anchor="middle">Cyberpunk</text>

    <!-- Chip 'Anime' -->
    <rect x="284" y="0" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="319" y="20" font-size="12" fill="#94a3b8" text-anchor="middle">Anime</text>

    <!-- Chip 'Space' -->
    <rect x="364" y="0" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="399" y="20" font-size="12" fill="#94a3b8" text-anchor="middle">Space</text>

    <!-- Chip 'OLED Dark' -->
    <rect x="444" y="0" width="94" height="30" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="491" y="20" font-size="12" fill="#94a3b8" text-anchor="middle">OLED Dark</text>
  </g>

  <!-- 3D Card Stack -->
  <!-- Card 3 (Back) -->
  <rect x="210" y="148" width="580" height="330" rx="20" fill="#0c0e17" stroke="#ffffff" stroke-opacity="0.05" opacity="0.4"/>
  <!-- Card 2 (Middle) -->
  <rect x="200" y="136" width="600" height="330" rx="22" fill="#0f121e" stroke="#ffffff" stroke-opacity="0.08" opacity="0.75"/>

  <!-- Card 1 (Front / Active Card) -->
  <g transform="translate(190, 124) rotate(-0.8 310 165)">
    <!-- Card Surface -->
    <rect width="620" height="340" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" filter="url(#dockShadow)"/>

    <!-- Simulated Neon Wallpaper Graphic -->
    <path d="M 0 240 Q 150 180, 310 210 T 620 170 L 620 340 L 0 340 Z" fill="#0c1322" opacity="0.9"/>
    <circle cx="480" cy="110" r="46" fill="#f43f5e" opacity="0.85"/>
    <path d="M 120 340 L 220 180 L 320 340 Z" fill="#1e1b4b" opacity="0.7"/>
    <path d="M 260 340 L 380 140 L 500 340 Z" fill="#2e1065" opacity="0.8"/>
    <!-- Grid Horizon Lines -->
    <line x1="0" y1="280" x2="620" y2="280" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="310" x2="620" y2="310" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Card Dark Gradient Fade Overlay -->
    <rect y="180" width="620" height="160" rx="24" fill="url(#bottomShadow)"/>

    <!-- Top Badges -->
    <g transform="translate(20, 20)">
      <!-- 4K Resolution Badge -->
      <rect width="142" height="26" rx="13" fill="#000000" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="14" y="17" font-size="11" font-weight="bold" fill="#38bdf8">⚡ 3840x2160 (4K)</text>
      <!-- Source Badge -->
      <rect x="150" width="115" height="26" rx="13" fill="#181028" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="164" y="17" font-size="11" font-weight="bold" fill="#c084fc">🌐 wallhaven.cc</text>
    </g>

    <!-- Floating Gesture Stamp: LIKE -->
    <g transform="translate(480, 28) rotate(10)" filter="url(#likeGlow)">
      <rect width="105" height="42" rx="10" fill="#000000" fill-opacity="0.8" stroke="#10b981" stroke-width="3"/>
      <text x="52" y="29" font-size="22" font-weight="900" fill="#10b981" letter-spacing="2" text-anchor="middle">LIKE</text>
    </g>

    <!-- Bottom Metadata -->
    <text x="24" y="285" font-size="20" font-weight="bold" fill="#ffffff">Midnight Cyber Horizon</text>
    <text x="24" y="310" font-size="13" font-weight="500" fill="#94a3b8">Art by Wallhaven Collective • SFW UHD</text>

    <!-- Color Dots -->
    <circle cx="540" cy="304" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="560" cy="304" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="580" cy="304" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="600" cy="304" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Bottom Liked Thumbnail Tray -->
  <g transform="translate(380, 480)">
    <!-- Slot 1 -->
    <rect x="0" y="0" width="42" height="26" rx="5" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Slot 2 -->
    <rect x="48" y="0" width="42" height="26" rx="5" fill="#0369a1" stroke="#10b981" stroke-width="1.5"/>
    <!-- Slot 3 -->
    <rect x="96" y="0" width="42" height="26" rx="5" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <!-- Slot 4 (Empty) -->
    <rect x="144" y="0" width="42" height="26" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="165" y="17" font-size="10" fill="#475569" text-anchor="middle">4</text>
    <!-- Slot 5 (Empty) -->
    <rect x="192" y="0" width="42" height="26" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="213" y="17" font-size="10" fill="#475569" text-anchor="middle">5</text>
  </g>

  <!-- Action Dock Buttons -->
  <g transform="translate(500, 560)">
    <!-- Undo Button (Z) -->
    <g transform="translate(-160, 0)">
      <circle cx="0" cy="0" r="22" fill="#12151f" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="6" font-size="16" fill="#c084fc" text-anchor="middle">↺</text>
      <text x="0" y="32" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">Z</text>
    </g>

    <!-- Pass Button (Left Arrow) -->
    <g transform="translate(-80, 0)">
      <circle cx="0" cy="0" r="28" fill="#12151f" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.8" filter="url(#passGlow)"/>
      <text x="0" y="8" font-size="22" font-weight="bold" fill="#f43f5e" text-anchor="middle">✕</text>
      <text x="0" y="38" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">←</text>
    </g>

    <!-- Apply Now (Up Arrow) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="24" fill="#12151f" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8" filter="url(#starGlow)"/>
      <text x="0" y="7" font-size="18" fill="#f59e0b" text-anchor="middle">★</text>
      <text x="0" y="34" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">↑</text>
    </g>

    <!-- Preview (Space) -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="22" fill="#12151f" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="6" font-size="16" fill="#38bdf8" text-anchor="middle">👁</text>
      <text x="0" y="32" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">SPACE</text>
    </g>

    <!-- Like Button (Right Arrow) -->
    <g transform="translate(160, 0)">
      <circle cx="0" cy="0" r="28" fill="#12151f" stroke="#10b981" stroke-width="2" stroke-opacity="0.8" filter="url(#likeGlow)"/>
      <text x="0" y="9" font-size="22" fill="#10b981" text-anchor="middle">♥</text>
      <text x="0" y="38" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">→</text>
    </g>
  </g>
</svg>
