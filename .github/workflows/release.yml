name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create Portable Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "wall-gem-windows-x64.zip" -Force

      - name: Publish Windows Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: wall-gem-windows-x64.zip

  build-linux:
    name: Build & Release Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Create Linux Tarball
        run: |
          tar -czvf wall-gem-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Publish Linux Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: wall-gem-linux-x64.tar.gz

  build-macos:
    name: Build & Release macOS (Universal / x64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create macOS Zip Archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../wall-gem-macos-x64.zip "Wall Gem.app"

      - name: Publish macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: wall-gem-macos-x64.zip
